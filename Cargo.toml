[package]
name = "mouse-me"
version = "0.1.0"
edition = "2021"
description = "Universal Linux & Omarchy cursor manager with modern Slint GUI & fast CLI"

[dependencies]
# GUI Framework
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg"] }

# CLI Parser
clap = { version = "4.5", features = ["derive"] }

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Filesystem & Path Utilities
dirs = "5.0"
walkdir = "2.5"

# Archive Extraction
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.4"
tempfile = "3.12"

# Image handling for previews
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Native file dialogs for Wayland/X11
rfd = "0.15"

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
tempfile = "3.12"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = "2.2"
serde_json = "1.0"
