name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package main build
        run: |
          mkdir -p dist
          tar -C target/release \
            -czf dist/mouse-me-main-linux-x86_64.tar.gz \
            mouse-me
          sha256sum dist/mouse-me-main-linux-x86_64.tar.gz \
            > dist/mouse-me-main-linux-x86_64.tar.gz.sha256

      - name: Upload main build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-me-main-linux-x86_64
          path: dist/
          retention-days: 14
