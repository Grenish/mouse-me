name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.2.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${INPUT_TAG:-$PUSH_TAG}"
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "Expected a tag such as v0.2.1, got: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run tests
        run: cargo test --tests

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          tar -C target/release \
            -czf "dist/mouse-me-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            mouse-me
          sha256sum \
            "dist/mouse-me-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            > "dist/mouse-me-${RELEASE_TAG}-linux-x86_64.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Mouse Me ${RELEASE_TAG}" \
              --generate-notes
          fi
